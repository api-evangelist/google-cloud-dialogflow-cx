name: Google Cloud Dialogflow CX
description: >-
  Google Cloud Dialogflow CX is an advanced conversational AI platform for
  building complex virtual agents and chatbots. It provides a visual flow
  builder, advanced NLU capabilities, multi-turn conversation management,
  and seamless integration across channels including web, mobile, and telephony.
